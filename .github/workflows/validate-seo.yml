name: Validate SEO

on:
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  validate-seo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate structured data / SEO
        run: bun run validate:seo
